name: Checks

on:
  pull_request:
  push:
    branches:
      - main

# These jobs only read the checked-out tree; none of them write to the repository.
permissions:
  contents: read

jobs:
  check_licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '>=1.16'
      - name: Install dependencies
        run: |
          go install github.com/google/addlicense@v1.2.0
      - name: addlicense
        run: |
          "${HOME}/go/bin/addlicense" -check -c "Open Reaction Database Project Authors" -l apache .

  check_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --locked
      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run ty
        run: |
          uv run ty check .

  test_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest -vv --durations=10
